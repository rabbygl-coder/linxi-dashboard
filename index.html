<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="工作台">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<link rel="icon" href="apple-touch-icon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>林夕个人管理工作台 · 奶茶陪你 🐰</title>
<style>
  :root{
    --orange:#FF6B1A;
    --orange-dark:#E2550A;
    --orange-soft:#FFF1E8;
    --orange-line:#FFD9C2;
    --bg:#FFF7F1;
    --card:#FFFFFF;
    --text:#3A2A20;
    --text-soft:#8A7A6E;
    --green:#3FB97A;
    --red:#E8553E;
    --blue:#4A90D9;
    --shadow:0 6px 18px rgba(255,107,26,.12);
    --radius:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    font-size:15px;line-height:1.5;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  input,select,textarea{font-family:inherit;font-size:14px;border:1.5px solid var(--orange-line);
    border-radius:12px;padding:10px 12px;width:100%;background:#fff;color:var(--text);outline:none;}
  input:focus,select:focus,textarea:focus{border-color:var(--orange);}
  .btn{background:var(--orange);color:#fff;border-radius:12px;padding:10px 16px;font-weight:600;
    box-shadow:var(--shadow);transition:.15s;display:inline-flex;align-items:center;gap:6px;justify-content:center;}
  .btn:active{transform:scale(.96);}
  .btn.ghost{background:#fff;color:var(--orange);border:1.5px solid var(--orange);box-shadow:none;}
  .btn.xs{font-size:12px;padding:4px 10px;}
  .todo-item .today-btn{font-size:12px;padding:3px 9px;white-space:nowrap;}
  .btn.small{padding:7px 12px;font-size:13px;border-radius:10px;}
  .btn.danger{background:#fff;color:var(--red);border:1.5px solid #f3b6ad;box-shadow:none;}
  .hidden{display:none !important;}

  /* Header */
  header{position:sticky;top:0;z-index:30;background:linear-gradient(135deg,var(--orange),#FF8A3D);
    color:#fff;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;
    box-shadow:0 4px 14px rgba(255,107,26,.3);}
  header .logo{font-weight:800;font-size:17px;display:flex;align-items:center;gap:6px;letter-spacing:.5px;}
  header .coins{background:rgba(255,255,255,.22);border-radius:20px;padding:6px 14px;font-weight:700;
    display:flex;align-items:center;gap:5px;backdrop-filter:blur(4px);}
  .pet-mini{display:flex;align-items:center;gap:6px;font-size:13px;background:rgba(255,255,255,.18);
    padding:5px 12px;border-radius:20px;}
  .pet-mini svg{width:26px;height:26px;}

  /* App container */
  #app{max-width:1080px;margin:0 auto;padding:16px 20px 96px;}

  /* Cards */
  .card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:14px;
    box-shadow:var(--shadow);}
  .card h3{margin:0 0 12px;font-size:16px;display:flex;align-items:center;gap:8px;}
  .card h3 .emo{font-size:20px;}
  .sub{color:var(--text-soft);font-size:13px;}

  /* Pet area */
  .pet-stage{background:linear-gradient(160deg,#FFF1E8,#FFE3D0);border-radius:var(--radius);
    padding:18px;text-align:center;position:relative;overflow:hidden;}
  .pet-stage .bunny{width:160px;height:160px;margin:0 auto;filter:drop-shadow(0 8px 12px rgba(0,0,0,.12));
    animation:bob 3s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  .pet-name{font-weight:800;font-size:18px;margin-top:4px;}
  .pet-status{display:inline-block;margin-top:6px;background:#fff;border-radius:14px;padding:5px 14px;
    font-size:13px;color:var(--orange-dark);font-weight:600;box-shadow:var(--shadow);}
  .attrs{margin-top:14px;display:grid;gap:10px;}
  .attr{display:grid;grid-template-columns:64px 1fr 42px;align-items:center;gap:10px;font-size:13px;}
  .attr .bar{height:12px;background:#FFE0CC;border-radius:8px;overflow:hidden;}
  .attr .bar i{display:block;height:100%;border-radius:8px;transition:width .4s;}
  .attr .val{text-align:right;font-weight:700;color:var(--text-soft);}

  /* 仪表盘新排版：上分左右，下为待办 */
  .home-top{display:grid;grid-template-columns:1.7fr 1fr;gap:14px;margin-bottom:14px;align-items:stretch;}
  .home-top>.card{margin-bottom:0;min-width:0;}
  @media(max-width:560px){.home-top{grid-template-columns:1fr;}}
  .pet-card .bunny-box{text-align:center;padding:4px 0 10px;}
  .pet-card .bunny-box img,.pet-card .bunny-box svg{width:144px;height:144px;object-fit:contain;}
  .bunny{font-size:80px;line-height:1;display:flex;align-items:center;justify-content:center;width:144px;height:144px;margin:0 auto;}
  .bunny.mini{font-size:20px;width:26px;height:26px;}
  .pet-card .pet-name{text-align:center;font-weight:700;font-size:15px;margin-bottom:2px;}
  .pet-card .pet-status{text-align:center;color:var(--text-soft);font-size:13px;margin-bottom:6px;}
  .quote-card{display:flex;flex-direction:column;}
  .quote-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .quote-title{font-weight:700;font-size:15px;color:var(--orange-dark);}
  .q-add{width:30px;height:30px;border-radius:50%;background:var(--orange-soft);color:var(--orange);
    font-size:20px;font-weight:700;line-height:1;display:flex;align-items:center;justify-content:center;
    box-shadow:var(--shadow);transition:.15s;}
  .q-add:hover{background:var(--orange);color:#fff;}
  .q-add:active{transform:scale(.92);}
  .quote-body{flex:1;display:flex;align-items:center;justify-content:center;padding:16px 4px;}
  .quote-text{font-size:18px;font-weight:600;line-height:1.65;color:var(--text);text-align:center;margin:0;}
  .quote-date{text-align:center;color:var(--text-soft);font-size:13px;margin-top:6px;}

  /* Dashboard todos */
  .todo-add{display:flex;gap:8px;margin-bottom:10px;}
  .todo-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--orange-soft);
    border-radius:12px;margin-bottom:8px;}
  .todo-item .chk{width:22px;height:22px;border-radius:7px;border:2px solid var(--orange);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px;color:#fff;}
  .todo-item.done .chk{background:var(--orange);}
  .todo-item.done .txt{text-decoration:line-through;color:var(--text-soft);}
  .todo-item .txt{flex:1;}
  .todo-item .del{color:var(--text-soft);font-size:18px;padding:0 4px;}

  /* Store */
  .shop-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
  .shop-item{background:var(--orange-soft);border-radius:14px;padding:12px;text-align:center;}
  .shop-item .ic{font-size:30px;}
  .shop-item .nm{font-weight:600;font-size:14px;margin:4px 0;}
  .shop-item .pr{color:var(--orange-dark);font-weight:700;font-size:13px;margin-bottom:8px;}
  .tabs{display:flex;gap:6px;background:var(--orange-soft);padding:4px;border-radius:14px;margin-bottom:14px;flex-wrap:wrap;}
  .tabs button{flex:1;padding:8px 6px;border-radius:10px;font-size:13px;font-weight:600;color:var(--text-soft);white-space:nowrap;}
  .tabs button.on{background:var(--orange);color:#fff;box-shadow:var(--shadow);}

  /* Bottom nav */
  nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#fff;display:flex;
    box-shadow:0 -4px 16px rgba(0,0,0,.06);max-width:1080px;margin:0 auto;}
  nav button{flex:1;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;
    color:var(--text-soft);font-size:11px;font-weight:600;}
  nav button .ic{font-size:22px;line-height:1;}
  nav button.on{color:var(--orange);}
  nav button.on .ic{transform:scale(1.12);}

  /* KPI rings */
  .kpi-row{display:flex;gap:14px;}
  .kpi{flex:1;text-align:center;}
  .kpi svg{width:130px;height:80px;}
  .kpi .label{font-weight:700;margin-top:2px;}
  .kpi .big{font-size:22px;font-weight:800;color:var(--orange);}
  /* KPI 双列：左 Opp / 右 Won，每列上下分块（仪表盘 + 记录列表） */
  .kpi-dash{text-align:center;margin-bottom:6px;}
  .kpi-dash svg{width:150px;height:92px;}
  .kpi-big{font-size:14px;font-weight:700;color:var(--text-soft);margin-top:2px;letter-spacing:.5px;}
  .icon-btn{width:30px;height:30px;border-radius:50%;background:var(--orange);color:#fff;font-size:18px;font-weight:700;line-height:1;display:inline-flex;align-items:center;justify-content:center;box-shadow:var(--shadow);flex:none;}
  .icon-btn:active{transform:scale(.92);}
  .deal-list{margin-top:10px;max-height:240px;overflow:auto;border-radius:12px;-webkit-overflow-scrolling:touch;}
  .deal-table{width:100%;min-width:max-content;border-collapse:collapse;table-layout:auto;font-size:13px;}
  .deal-table th{position:sticky;top:0;background:#FFF3E9;color:var(--text-soft);font-weight:700;font-size:12px;text-align:left;padding:8px 8px;border-bottom:2px solid var(--orange-line);z-index:2;white-space:nowrap;}
  .deal-table.won-table th{background:#EAF8F0;border-bottom-color:#BFE6CE;}
  .deal-table td{padding:8px 8px;border-bottom:1px solid #F3E7DD;vertical-align:middle;white-space:nowrap;}
  .deal-table tr:last-child td{border-bottom:none;}
  .deal-table .c-name{font-weight:700;white-space:nowrap;}
  .deal-table .c-bd{color:var(--text-soft);font-size:12px;white-space:nowrap;}
  .deal-table .c-date{color:var(--text-soft);font-size:12px;white-space:nowrap;}
  .deal-table .c-act{white-space:nowrap;}
  .deal-table .c-act .btn{margin:2px 2px;}
  .status-badge{font-size:11px;border-radius:8px;padding:1px 8px;font-weight:700;white-space:nowrap;}
  .st-pta{background:#FFE9E4;color:var(--red);}
  .st-acc{background:#FFF3D6;color:#C98A00;}
  .st-won{background:#E3F6EC;color:var(--green);}
  .deal .btn.won{background:#3FB97A;}
  .empty-hint{font-size:13px;color:var(--text-soft);text-align:center;padding:14px 0;}

  /* 围度趋势·记录表格（竖滚·固定显示最新3行） */
  .meas-scroll{margin-top:12px;max-height:146px;overflow-y:auto;overflow-x:auto;border:1px solid var(--orange-line);border-radius:12px;-webkit-overflow-scrolling:touch;}
  .meas-table{border-collapse:collapse;font-size:13px;width:100%;min-width:max-content;}
  .meas-table thead th{position:sticky;top:0;background:#FFF3E9;color:var(--text-soft);font-weight:700;font-size:12px;text-align:center;padding:9px 8px;border-bottom:2px solid var(--orange-line);z-index:2;white-space:nowrap;}
  .meas-table tbody td{height:36px;padding:0 8px;border-bottom:1px solid #F3E7DD;text-align:center;vertical-align:middle;white-space:nowrap;color:var(--text-soft);}
  .meas-table tbody tr:last-child td{border-bottom:none;}
  .meas-table .mc-date{font-weight:700;color:var(--text);}
  .meas-table .mc-num{font-variant-numeric:tabular-nums;}
  .meas-table .mc-empty{color:#C9B9AE;}
  .meas-table .mc-act .del{font-size:14px;color:#C9B9AE;}

  /* Study */
  .study-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;}
  .stat{background:var(--orange-soft);border-radius:14px;padding:12px;text-align:center;}
  .stat .v{font-size:20px;font-weight:800;color:var(--orange-dark);}
  .stat .l{font-size:12px;color:var(--text-soft);margin-top:2px;}
  .chapter{border:1px solid var(--orange-line);border-radius:14px;margin-bottom:10px;overflow:hidden;}
  .chapter .ch-head{padding:12px 14px;background:var(--orange-soft);display:flex;justify-content:space-between;
    align-items:center;font-weight:700;cursor:pointer;}
  .chapter .ch-head .pg{font-size:12px;color:var(--text-soft);font-weight:600;}
  .lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;padding:12px;}
  .lesson{aspect-ratio:1;border-radius:12px;background:#FFF4EC;border:1.5px solid var(--orange-line);
    display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:600;
    color:var(--text-soft);position:relative;}
  .lesson.done{background:var(--orange);color:#fff;border-color:var(--orange);}
  .lesson .d{font-size:9px;margin-top:2px;opacity:.85;}
  .econ-list{margin-top:10px;max-height:62vh;overflow-y:auto;}
  .econ-row{display:flex;align-items:center;gap:8px;padding:9px 10px;border-bottom:1px solid #FFEADF;border-radius:8px;cursor:pointer;}
  .econ-row:hover{background:#FFF7F0;}
  .econ-row.done{background:#EAF7EE;}
  .econ-row.done .ename{text-decoration:line-through;color:var(--text-soft);}
  .econ-row .eidx{width:24px;text-align:center;color:var(--text-soft);font-size:12px;flex:none;}
  .econ-row .ename{flex:1;font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .econ-row .emins{flex:none;font-size:11px;color:var(--orange-dark);background:var(--orange-soft);padding:1px 7px;border-radius:9px;}
  .econ-row .d{flex:none;font-size:11px;color:#2E7D32;}

  /* Life supplies */
  .supply{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--orange-soft);
    border-radius:12px;margin-bottom:8px;}
  .supply .info{flex:1;}
  .supply .info .nm{font-weight:600;}
  .supply .info .meta{font-size:12px;color:var(--text-soft);}
  .supply .qty{font-weight:800;color:var(--orange-dark);font-size:18px;min-width:30px;text-align:center;}
  .supply.warn{background:#FFE9E4;}

  /* Calendar */
  .cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .cal-head{display:flex;align-items:center;justify-content:center;gap:16px;margin:2px 0 12px;}
  .cal-label{font-size:16px;font-weight:700;min-width:104px;text-align:center;}
  .cal-head .today-btn{flex:none;font-size:12px;padding:3px 10px;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
  .cal-grid .dow{text-align:center;font-size:11px;color:var(--text-soft);padding:4px 0;}
  .cal-cell{aspect-ratio:1;border-radius:10px;background:var(--orange-soft);display:flex;flex-direction:column;
    align-items:center;justify-content:center;font-size:13px;position:relative;color:var(--text);overflow:hidden;}
  .cal-cell.muted{opacity:.35;}
  .cal-cell.today{outline:2px solid var(--orange);}
  .cal-cell .dnum{position:absolute;top:3px;left:5px;font-size:11px;font-weight:700;}
  .cal-cell .ci-icons{position:absolute;bottom:2px;left:0;right:0;display:flex;flex-wrap:wrap;
    justify-content:center;gap:1px;font-size:13px;line-height:1.1;padding:0 2px;}

  /* 月历·本月打卡统计 */
  .ci-stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
  .ci-stat{display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-width:52px;padding:8px 6px;border-radius:12px;background:var(--orange-soft);
    border:1px solid rgba(255,217,194,.5);}
  .ci-stat-ic{font-size:20px;line-height:1.1;}
  .ci-stat-n{font-size:16px;font-weight:800;color:var(--orange-dark);margin-top:2px;font-variant-numeric:tabular-nums;}

  /* checkin list */
  .ci-item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:var(--orange-soft);
    margin-bottom:8px;}
  .ci-item .ci-ic{font-size:24px;width:34px;text-align:center;}
  .ci-item .ci-nm{flex:1;font-weight:600;}
  .ci-item.ci-on{background:#FFF0E6;outline:1.5px solid var(--orange);}
  .ci-item .ci-ok{display:inline-block;margin-left:6px;font-size:12px;color:var(--green);font-weight:700;}
  .ci-note{margin-top:6px;}
  .ci-recent{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
  .ci-recent span{background:#fff;border:1px solid var(--orange-line);border-radius:10px;padding:4px 10px;
    font-size:12px;color:var(--text-soft);}

  /* Beauty */
  .progress{height:18px;background:#FFE0CC;border-radius:10px;overflow:hidden;margin:8px 0;}
  .progress i{display:block;height:100%;background:linear-gradient(90deg,var(--orange),#FFB07A);border-radius:10px;}
  .meas-form{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
  .meas-row{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--orange-soft);border-radius:10px;margin-bottom:6px;}
  .meas-row .lab{width:60px;font-size:13px;color:var(--text-soft);}
  .meas-row input{width:80px;padding:6px 8px;}
  /* 变美·目标进度 */
  .goal-steps{display:flex;align-items:flex-end;justify-content:space-between;gap:6px;margin:6px 0 4px;}
  .step{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0;}
  .step .lab{font-size:13px;color:var(--text-soft);font-weight:500;}
  .step .val{font-size:26px;font-weight:800;color:var(--orange);line-height:1;display:flex;align-items:baseline;gap:3px;}
  .step .val .u{font-size:12px;color:var(--text-soft);font-weight:600;}
  .arrow{font-size:22px;color:var(--orange);font-weight:700;flex:0 0 auto;padding-bottom:14px;opacity:.7;}
  .card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px;flex-wrap:wrap;}
  .card-head h3{margin:0;}
  .empty-hint{text-align:center;color:var(--text-soft);font-size:14px;padding:56px 20px;min-height:160px;display:flex;align-items:center;justify-content:center;background:#FFFBF7;border-radius:12px;border:1px dashed var(--orange-line);}

  /* Hobby */
  .hobby-tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;}
  .hobby-tabs button{flex:0 0 auto;padding:8px 14px;border-radius:12px;background:var(--orange-soft);font-weight:600;color:var(--text-soft);}
  .hobby-tabs button.on{background:var(--orange);color:#fff;}
  .proj{display:flex;background:var(--card);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);}
  /* 左侧竖排状态标签（微软雅黑） */
  .proj .p-tab{width:22px;flex-shrink:0;writing-mode:vertical-rl;text-orientation:upright;
    display:flex;align-items:center;justify-content:center;
    font-family:'Microsoft YaHei','微软雅黑',sans-serif;font-size:12px;font-weight:500;letter-spacing:2px;color:#fff;}
  .proj.Pending{background:#FFF6EE;}
  .proj.Pending .p-tab{background:var(--orange);}
  .proj.ing{background:#EAF3FD;}
  .proj.ing .p-tab{background:var(--blue);}
  .proj.done{background:#EAF7EF;}
  .proj.done .p-tab{background:var(--green);}
  .proj .p-body{flex:1;min-width:0;padding:10px 12px;}
  .proj .p-top{display:flex;gap:10px;align-items:stretch;}
  .proj .thumb{width:54px;height:54px;border-radius:10px;background:var(--orange-soft);object-fit:cover;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--orange);}
  /* 右侧两行：缩略图与文字块上下齐平 */
  .proj .p-info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between;height:54px;}
  .proj .p-name-row{display:flex;align-items:baseline;justify-content:space-between;gap:6px;min-width:0;}
  .proj .p-name{flex:1;min-width:0;font-weight:700;font-size:16px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .proj .p-meta{font-size:12px;color:var(--text-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .proj .p-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:nowrap;}
  /* 4 个按钮均分一行、可收缩，永不换行（手机/iPhone 也能整行显示） */
  .proj .p-actions .btn{flex:1 1 0;min-width:0;padding-left:6px;padding-right:6px;justify-content:center;}
  /* 爱好项目分栏：默认一行 4 个，窄屏自适应 */
  /* 爱好项目分栏：默认一行 4 个。用 minmax(0,1fr) 让列可收缩，避免内容最小宽度把 4 列撑破导致溢出/显示不全 */
  #projList{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;align-items:start;}
  #projList .proj{margin-bottom:0;min-width:0;}
  #projList .empty{grid-column:1 / -1;}

/* ============================================================
   设计升级层（覆盖原基础样式，统一更精致的视觉语言）
   仅增强视觉，不改动任何结构 / 类名，JS 逻辑不受影响
   ============================================================ */
:root{
  --radius:22px;
  --radius-sm:14px;
  --shadow-sm:0 2px 8px rgba(255,107,26,.07);
  --shadow:0 4px 14px rgba(255,107,26,.08), 0 14px 34px rgba(58,42,32,.07);
  --shadow-lg:0 18px 50px rgba(58,42,32,.18);
  --grad:linear-gradient(135deg,#FF8A3D 0%,#FF6B1A 100%);
  --grad-soft:linear-gradient(160deg,#FFF3E9 0%,#FFE6D3 100%);
}
/* 背景：暖色双层径向光晕，固定不随滚动 */
html,body{
  background:
    radial-gradient(1100px 620px at 108% -8%, #FFE7D4 0%, rgba(255,231,212,0) 58%),
    radial-gradient(900px 520px at -8% 4%, #FFF0E6 0%, rgba(255,240,230,0) 55%),
    #FFF7F1;
  background-attachment:fixed;
}
/* 卡片：圆角 + 细描边 + 双层柔和阴影 */
.card{
  border:1px solid rgba(255,217,194,.55);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:18px;
}
.card h3{letter-spacing:.2px;}
.card h3 .emo{filter:drop-shadow(0 2px 3px rgba(255,107,26,.25));}

/* 顶部栏：更饱满的渐变 + 底部柔光 */
header{
  background:linear-gradient(135deg,#FF812E 0%,#FF5C0E 100%);
  box-shadow:0 8px 24px rgba(255,107,26,.30);
  padding:13px 18px;
}
header .logo{font-size:18px;letter-spacing:.5px;}
header .coins{
  background:linear-gradient(135deg,rgba(255,255,255,.30),rgba(255,255,255,.14));
  border:1px solid rgba(255,255,255,.35);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4);
}
.pet-mini{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);}

/* 按钮：渐变 + 悬浮抬升 + 聚焦光环 */
.btn{
  background:var(--grad);
  border-radius:14px;padding:11px 18px;font-weight:700;letter-spacing:.3px;
  box-shadow:0 6px 16px rgba(255,107,26,.28);
  transition:transform .18s ease, box-shadow .18s ease, filter .18s ease;
}
.btn:hover{transform:translateY(-1px);box-shadow:0 10px 22px rgba(255,107,26,.34);filter:saturate(1.05);}
.btn:active{transform:translateY(0) scale(.97);}
.btn.ghost{background:#fff;color:var(--orange);border:1.5px solid var(--orange-line);box-shadow:none;}
.btn.ghost:hover{background:var(--orange-soft);border-color:var(--orange);transform:translateY(-1px);}
.btn.danger{background:#fff;color:var(--red);border:1.5px solid #f3b6ad;box-shadow:none;}
.btn.danger:hover{background:#FFF1EF;}
.btn.xs,.todo-item .today-btn,.btn.small{box-shadow:0 3px 8px rgba(255,107,26,.16);}

/* 输入：聚焦光环 */
input,select,textarea{
  background:#FFFDFB;border-radius:14px;padding:11px 13px;
  box-shadow:inset 0 1px 2px rgba(58,42,32,.03);
  transition:border-color .18s, box-shadow .18s;
}
input:focus,select:focus,textarea:focus{
  border-color:var(--orange);
  box-shadow:0 0 0 4px rgba(255,107,26,.13);
}

nav{

nav button.on{

}
nav button.on .ic{transform:scale(1.1);}
nav button:not(.on):hover{background:var(--orange-soft);}
#app{padding-bottom:108px;}

.pet-stage{

/* 交易表格：表头渐变 + 行悬浮 */

/* 待办 / 列表项：渐变底 + 轻阴影 */
.todo-item{background:linear-gradient(135deg,#FFF3EA,#FFEADF);box-shadow:var(--shadow-sm);border:1px solid rgba(255,217,194,.4);}

.shop-item{background:linear-gradient(160deg,#FFF3E9,#FFE6D3);box-shadow:var(--shadow-sm);border:1px solid rgba(255,217,194,.4);}

/* 学习统计卡 / 章节 / 课程格 */
.study-stats{gap:12px;}
.stat{background:linear-gradient(160deg,#FFF3E9,#FFE6D3);box-shadow:var(--shadow-sm);border:1px solid rgba(255,217,194,.4);}
.stat .v{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.chapter{border:1px solid var(--orange-line);box-shadow:var(--shadow-sm);}
.chapter .ch-head{background:linear-gradient(135deg,#FFF3E9,#FFEAD9);}
.lesson{box-shadow:var(--shadow-sm);border:1.5px solid var(--orange-line);transition:transform .15s, box-shadow .15s;}
.lesson:hover{transform:translateY(-2px);box-shadow:var(--shadow);}
.lesson.done{box-shadow:0 6px 14px rgba(255,107,26,.3);}

/* 学习 Dashboard：两行课程概览 + 小型环形图 */
.course-rows{display:flex;flex-direction:column;gap:10px;margin-bottom:14px;}
.course-row{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border:1px solid var(--orange-line);border-radius:14px;padding:12px 16px;box-shadow:var(--shadow-sm);}
.course-row .cr-info{display:flex;flex-direction:column;gap:4px;min-width:0;}
.course-row .cr-name{font-size:15px;font-weight:700;color:var(--text);}
.course-row .cr-stat{font-size:13px;color:var(--text-soft);}
.mini-ring{width:64px;height:64px;flex:none;}

/* 考试倒计时模块：天数字体加大 */
.countdown{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:linear-gradient(135deg,#FFF3E9,#FFE2CC);}
.countdown .cd-label{font-size:14px;color:var(--text-soft);}
.countdown .cd-num{font-size:64px;font-weight:900;line-height:1.05;color:var(--orange);}
.countdown .cd-num-row{display:flex;align-items:baseline;gap:6px;}
.countdown .cd-unit{font-size:14px;color:var(--text-soft);}
.countdown .cd-date{font-size:13px;color:var(--text-soft);cursor:pointer;border-bottom:1px dashed var(--orange-line);padding-bottom:1px;display:inline-block;}
.countdown .cd-date:hover{color:var(--orange);}

/* 日历：渐变格 + 悬浮抬升 + 今日光环 */
.cal-cell{background:linear-gradient(160deg,#FFF3E9,#FFE6D3);box-shadow:0 1px 3px rgba(255,107,26,.08);transition:transform .15s, box-shadow .15s;}
.cal-cell:hover{transform:translateY(-2px);box-shadow:0 5px 12px rgba(255,107,26,.16);}

/* 变美进度条 / 目标阶梯 */
.progress{height:20px;background:#FFE7D7;box-shadow:inset 0 1px 3px rgba(58,42,32,.06);}

</style>

/* ============ 存取 ============ */
async function load(){
  // 浏览器本地存储为主；跨设备同步通过「设置 → 导出/导入 JSON」完成
  try{
    const r=localStorage.getItem(KEY);
    if(r){ S=JSON.parse(r); migrate(); syncCheckins(); persist(); return; }
  }catch(e){}
  // 全新用户
  S=defaultState(); computeDecay(); syncCheckins(); persist();
}
function migrate(){
  const d=defaultState();
  // 补齐缺失字段
  for(const k in d){if(S[k]===undefined)S[k]=d[k];}
  if(!S.pet)S.pet=d.pet;
  if(!Array.isArray(S.quotes))S.quotes=d.quotes.slice();
  if(!S.study.biz||!S.study.biz.length)S.study.biz=d.study.biz;
  else if(!S.study.biz[0]||S.study.biz[0].mins===undefined)S.study.biz=d.study.biz; // 旧版章计数占位（无 mins）→ 用真实逐课种子替换
  if(!Array.isArray(S.study.economy)||!S.study.economy.length)S.study.economy=ECON_SEED.map(x=>({id:uid(),name:x.n,mins:x.m,date:null}));
  // TDL <-> 今日待办 关联字段补齐
  if(S.work&&S.work.tdl)S.work.tdl.forEach(t=>{ if(!('homeId' in t))t.homeId=null; });
  if(S.todos)S.todos.forEach(x=>{ if(!('wid' in x))x.wid=null; });
  // KPI：旧 oppRecords/wonRecords 合并为统一 deals（status: PTA/Accept/Won）
  if(S.work){
    if(!Array.isArray(S.work.deals))S.work.deals=[];
    if(S.work.oppRecords||S.work.wonRecords){
      const dr=S.work.deals.slice();
      (S.work.oppRecords||[]).forEach(r=>dr.push({id:r.id||uid(),company:r.company||'(未填公司)',bd:r.bd||'',date:r.date||today(),status:r.accepted?'Accept':'PTA'}));
      (S.work.wonRecords||[]).forEach(r=>dr.push({id:r.id||uid(),company:r.company||'(未填公司)',bd:r.bd||'',date:r.date||today(),status:'Won'}));
      S.work.deals=dr;
      delete S.work.oppRecords;delete S.work.wonRecords;
      delete S.work.opp;delete S.work.won;
    }
    if(S.work.oppGoal==null)S.work.oppGoal=24;
    if(S.work.wonGoal==null)S.work.wonGoal=4;
    if(!Array.isArray(S.work.bdOptions))S.work.bdOptions=['Alex','Joann','Katherine','Liam'];
  }
  // 学习计划 / 物品管理 字段补齐
  if(!S.study)S.study={};
  if(!Array.isArray(S.study.plans))S.study.plans=[];
  if(!S.life)S.life={};
  if(!Array.isArray(S.life.items))S.life.items=[];
  if(S.study.plans)S.study.plans.forEach(p=>{ if(!('homeId' in p))p.homeId=null; });
  // 今日待办来源标识（src: work/study/null）
  if(S.todos)S.todos.forEach(x=>{ if(!('wid' in x))x.wid=null; if(!('src' in x))x.src = x.fromWork? 'work': null; });
}
/* 持久化：浏览器本地存储（GitHub Pages 为纯静态站点，数据保存于本机浏览器；跨设备同步请用设置页的「导出/导入 JSON」） */
function persist(){
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast('保存失败');}
}
function save(){persist();}


/* ============ 金币 ============ */
function addCoins(n,reason){
  S.coins=Math.max(0,S.coins+n);
  if(n>0)toast('+'+n+' 🪙 '+(reason||''));
  else if(n<0)toast(n+' 🪙 '+(reason||''));
  save();renderHeader();
}

/* ============ 宠物衰减 ============ */
function computeDecay(){
  const p=S.pet;if(p.dead)return;
  const now=Date.now();const last=p.lastActive||now;
  const h=Math.max(0,(now-last)/3600000);
  p.satiety=Math.max(0,Math.round(p.satiety-5*(h/4)));
  p.mood=Math.max(0,Math.round(p.mood-4*(h/3)));
  p.clean=Math.max(0,Math.round(p.clean-3*(h/6)));
  // 健康：前三项长期低则加速下降
  const low=(p.satiety===0?1:0)+(p.mood===0?1:0)+(p.clean===0?1:0);
  let hd=0;
  if(p.satiety===0)hd+=2*(h/4);
  if(p.mood===0)hd+=2*(h/3);
  if(p.clean===0)hd+=2*(h/6);
  if(low>=2)hd+=1*(h/4);
  p.health=Math.max(0,Math.round(p.health-hd));
  p.lastActive=now; // 关键：把上次照顾时间推进到「现在」，下次只衰减新流逝的时段
}
function petStatusText(){
  const p=S.pet;
  if(p.dead)return '💀 奶茶离开了…用 100 🪙 复活';
  const h=(Date.now()-(p.lastActive||Date.now()))/3600000;
  if(h>=72)return '😵 72h 未互动，已去世';
  if(h>=48)return '🤒 生病了，快来看看我';
  if(h>=24)return '🍽️ 饿坏啦，想吃东西';
  if(p.health<30)return '😟 身体不太舒服…';
  if(p.satiety<30||p.mood<30||p.clean<30)return '😿 需要你的照顾~';
  return '😊 奶茶心情超好！';
}
function petLifeStage(){
  // 小奶兔 / 少年兔 / 成年兔 依据等级（用健康+属性粗略，或按累计互动）
  const lvl=Math.min(3,1+Math.floor((100-S.pet.health)/40));
  return ['小奶兔','少年兔','成年兔'][lvl-1];
}

/* ============ 兔兔图片（按健康/心情/饱腹切换姿态） ============ */
// 健康 <40 → sleeping 趴着睡 ｜ 心情 <35 → sad 垂耳坐 ｜
// 饱腹 <35 → eating 啃萝卜 ｜ 饱腹 ≥60 且 心情 ≥60 → happy 挥手 ｜ 默认 eating
const BUNNY_FILES={
  happy:'rabbit_happy.png',
  eating:'rabbit_eating.png',
  sad:'rabbit_sad.png',
  sleeping:'rabbit_sleeping.png'
};
function petPosture(){
  const p=S.pet||{};
  if((p.health??100)<40) return 'sleeping';
  if((p.mood??100)<35)   return 'sad';
  if((p.satiety??100)<35) return 'eating';
  if(p.satiety>=60 && p.mood>=60) return 'happy';
  return 'eating';
}
function bunnyErr(img){
  // 图片加载失败时的兜底（避免 onerror 内嵌引号破坏 HTML 结构）
  const small=(parseInt(img.style.width)||144)<=40;
  const d=document.createElement('div');
  d.className='bunny'+(small?' mini':'');
  d.textContent='🐰';
  img.replaceWith(d);
}
function rabbitHTML(){
  // 用户自定义照片优先（添加后即覆盖姿态映射）
  const custom=S.pet.images||[];
  if(custom.length){
    const url=custom[Math.floor(Math.random()*custom.length)];
    return `<img class="bunny" src="${esc(url)}" alt="奶茶" onerror="bunnyErr(this)">`;
  }
  const f=BUNNY_FILES[petPosture()];
  return `<img class="bunny" src="${f}" alt="奶茶" onerror="bunnyErr(this)">`;
}
function miniBunnyHTML(){
  const custom=S.pet.images||[];
  let src=custom.length?custom[0]:BUNNY_FILES[petPosture()];
  return `<img src="${esc(src)}" style="width:26px;height:26px;border-radius:50%;object-fit:cover;vertical-align:middle;background:#FFF3E8" onerror="bunnyErr(this)">`;
}

      </div>
      ${dealTable(oppDeals,'opp')}
    </div>
    <div class="card card-won">
      <div class="card-head">
        <h3><span class="emo">🏆</span>Won 赢单</h3>
      </div>
      <div class="kpi-dash">
        ${halfRing(wonPct,'#3FB97A')}
        <div class="kpi-big" style="color:#3FB97A">${wonCount} / ${w.wonGoal} 达成</div>
      </div>
      ${dealTable(wonDeals,'won')}

      <button class="btn ghost xs" onclick="addTdlToday()">+Today</button>
    </div>
    <div id="tdlList">${tdl||'<div class="empty">暂无工作待办</div>'}</div>
    <p class="sub mt">提示：点「+Today」把这条工作待办一键推到仪表盘今日待办（只是加入清单，不自动完成）；关联后显示「今天就干💪」，可点「再放放」移出今日待办。勾选完成两边双向同步状态。</p>
  </div>`;
}
function halfRing(pct,color){
  const w=130,h=80,r=52,cx=65,cy=72;
  const circ=Math.PI*r;const off=circ*(1-pct/100);
  return `<svg viewBox="0 0 ${w} ${h}">
    <path d="M${cx-r} ${cy} A${r} ${r} 0 0 1 ${cx+r} ${cy}" fill="none" stroke="#FFE0CC" stroke-width="12" stroke-linecap="round"/>
    <path d="M${cx-r} ${cy} A${r} ${r} 0 0 1 ${cx+r} ${cy}" fill="none" stroke="${color}" stroke-width="12" stroke-linecap="round"
      stroke-dasharray="${circ}" stroke-dashoffset="${off}"/>
    <text x="${cx}" y="70" text-anchor="middle" font-size="30" font-weight="800" fill="${color}">${pct}%</text>
  </svg>`;
}
function bindWork(){
  document.querySelectorAll('#tdlList .todo-item').forEach(el=>{
    el.onclick=e=>{
      const tgt=e.target;
      if(tgt.dataset.wdel){
        const t=S.work.tdl.find(x=>x.id===tgt.dataset.wdel);
        if(t&&t.homeId)S.todos=S.todos.filter(x=>x.id!==t.homeId); // 删 TDL 时连带删今日待办
        S.work.tdl=S.work.tdl.filter(x=>x.id!==tgt.dataset.wdel);save();render();return;
      }
      if(tgt.dataset.wlink){ linkTdlToHome(tgt.dataset.wlink); return; }   // 仅关联，不完成
      if(tgt.dataset.wunlink){ unlinkTdl(tgt.dataset.wunlink); return; }   // 移出今日待办，保留 TDL
      const t=S.work.tdl.find(x=>x.id===el.dataset.wid);if(!t)return;
      t.done=!t.done;
      syncLinked('tdl',t.id); // 同步到关联今日待办（静默，不重复发币）
      if(t.done)addCoins(10,'完成TDL');else{S.coins=Math.max(0,S.coins-10);save();renderHeader();}
      save();render();
    };
  });
}
function addTdl(){
  const i=$('#tdlInput');const v=i.value.trim();if(!v)return;
  S.work.tdl.unshift({id:uid(),text:v,done:false,homeId:null});
  i.value='';save();render();
}
/* 把输入的工作待办一键同时加入 TDL 与今日待办并关联 */
function addTdlToday(){
  const i=$('#tdlInput');const v=i.value.trim();if(!v)return;
  const todo={id:uid(),text:v,done:false,fromWork:true,src:'work',wid:null};
  const wk={id:uid(),text:v,done:false,homeId:todo.id};
  todo.wid=wk.id;
  S.work.tdl.unshift(wk);
  S.todos.unshift(todo);
  i.value='';save();render();
}
/* 把已存在的某条 TDL 推到今日待办（关联） */
function linkTdlToHome(wid){
  const t=S.work.tdl.find(x=>x.id===wid);if(!t||t.homeId)return;
  const todo={id:uid(),text:t.text,done:t.done,fromWork:true,src:'work',wid:t.id};
  t.homeId=todo.id;
  S.todos.unshift(todo);
  save();render();toast('已加入今日待办 ✅');
}
/* 再放放：从今日待办移除关联项，但保留 TDL 工作项本身 */
function unlinkTdl(wid){
  const t=S.work.tdl.find(x=>x.id===wid);if(!t)return;
  if(t.homeId){S.todos=S.todos.filter(x=>x.id!==t.homeId);t.homeId=null;}
  save();render();toast('已放回清单，下次再说 😌');
}
/* 找到今日待办关联的「来源项」（工作 TDL 或 学习计划） */
function findLinkedSource(wid){
  return (S.work.tdl&&S.work.tdl.find(x=>x.id===wid))
      || (S.study.plans&&S.study.plans.find(x=>x.id===wid))
      || null;
}
/* 双向同步：src='tdl' 表示刚改了来源项（工作TDL 或 学习计划），把完成态写到关联今日待办；src='todo' 反之 */
function syncLinked(src,id){
  if(src==='tdl'){
    let t=S.work.tdl.find(x=>x.id===id);
    if(!t&&S.study.plans)t=S.study.plans.find(x=>x.id===id);
    if(!t||!t.homeId)return;
    const todo=S.todos.find(x=>x.id===t.homeId);if(todo)todo.done=t.done;
  }else{
    const x=S.todos.find(y=>y.id===id);if(!x||!x.wid)return;
    const t=findLinkedSource(x.wid);if(t)t.done=x.done;
  }
}
/* 新增 / 切换 / 编辑 / 删除 Opp/Won 记录（统一 deals 模型，状态 PTA→Accept→Won） */

// BD 下拉字段：选项来自 S.work.bdOptions，每项带 ✕ 删除；底部「+ 添加」新增选项。
// 删除选项只改 bdOptions，不影响已存的 deals（deals 里 bd 是独立字符串）。
function bdField(current){
  const opts=S.work.bdOptions||[];
  const list=opts.slice();
  if(current && !list.includes(current))list.unshift(current); // 编辑时已不在选项中的旧值仍显示并可选中
  const rows=list.map(o=>`<div class="bd-row"><span class="bd-name" data-name="${esc(o)}" onclick="pickBd(this.dataset.name)">${esc(o)}</span><button type="button" class="bd-x" data-name="${esc(o)}" onclick="delBdOpt(this.dataset.name)" title="删除该选项">✕</button></div>`).join('');
  const sel=current||'选择 BD ▾';
  return `<div class="field"><label>BD</label>
    <div class="bd-select">
      <button type="button" class="bd-toggle" onclick="toggleBdPanel()">${esc(sel)}</button>
      <div class="bd-panel" id="bdPanel" style="display:none">
        <div id="bdList">${rows}</div>
        <div class="bd-add"><input id="bdNewInput" placeholder="新 BD 名称…"><button type="button" class="btn xs" onclick="addBdOpt()">+ 添加</button></div>
      </div>
    </div>
    <input type="hidden" id="dealBd" value="${esc(current||'')}">
  </div>`;
}
function toggleBdPanel(){const p=$('#bdPanel');if(p)p.style.display=p.style.display==='none'?'block':'none';}
function pickBd(name){
  const h=$('#dealBd');if(h)h.value=name;
  const t=document.querySelector('.bd-toggle');if(t)t.textContent=name;
  const p=$('#bdPanel');if(p)p.style.display='none';
}
function addBdOpt(){
  const i=$('#bdNewInput');if(!i)return;const v=i.value.trim();if(!v)return;
  if(!S.work.bdOptions.includes(v)){S.work.bdOptions.push(v);save();}
  const list=$('#bdList');
  if(list){
    const row=document.createElement('div');row.className='bd-row';
    row.innerHTML=`<span class="bd-name" data-name="${esc(v)}" onclick="pickBd(this.dataset.name)">${esc(v)}</span><button type="button" class="bd-x" data-name="${esc(v)}" onclick="delBdOpt(this.dataset.name)" title="删除该选项">✕</button>`;
    list.appendChild(row);
  }
  i.value='';pickBd(v);
}
function delBdOpt(name){
  S.work.bdOptions=S.work.bdOptions.filter(x=>x!==name);save();
  document.querySelectorAll('#bdList .bd-row').forEach(r=>{const n=r.querySelector('.bd-name');if(n&&n.dataset.name===name)r.remove();});
  const h=$('#dealBd');
  if(h&&h.value===name){h.value='';const t=document.querySelector('.bd-toggle');if(t)t.textContent='选择 BD ▾';}
}
function confirmAddDeal(){
  const c=$('#dealCompany').value.trim()||'(未填公司)';
  const bd=$('#dealBd').value.trim();
  const date=$('#dealDate').value||today();
  const status=$('#dealStatus').value;
  S.work.deals.push({id:uid(),company:c,bd,date,status});
  const g=awardDealCoins(null,status);          // 创建时若直接选 Accept/Won 也按进入状态发币
  if(g)addCoins(g, status==='Won'?'Won +99':'Accept +50');
  save();closeModal();render();
}
function awardDealCoins(oldStatus,newStatus){
  const rank={'PTA':0,'Accept':1,'Won':2};
  const o=oldStatus==null?-1:(rank[oldStatus]??0), n=rank[newStatus]??0;
  let g=0; if(n>=1&&o<1)g+=50; if(n>=2&&o<2)g+=99; return g;
}
function switchDeal(id){
  const d=S.work.deals.find(x=>x.id===id);if(!d)return;
  const next=d.status==='PTA'?'Accept':'Won';
  const old=d.status; d.status=next; d.date=today();   // 状态切换→日期更新为切换当天
  const g=awardDealCoins(old,next);
  if(g)addCoins(g, next==='Won'?'Won +99':'Accept +50');
  save();render();
}
function editDeal(id){
  const d=S.work.deals.find(x=>x.id===id);if(!d)return;
  showModal('编辑记录',`
    <div class="field"><label>公司名称</label><input id="dealCompany" value="${esc(d.company)}"></div>
    ${bdField(d.bd)}
    <div class="field"><label>日期</label><input type="date" id="dealDate" value="${d.date}"></div>
    <div class="field"><label>状态</label><select id="dealStatus">
      ${['PTA','Accept','Won'].map(s=>`<option value="${s}" ${s===d.status?'selected':''}>${s}</option>`).join('')}
    </select></div>
    <button class="btn" style="width:100%" onclick="saveDeal('${id}')">保存</button>
  `);
}
function saveDeal(id){
  const d=S.work.deals.find(x=>x.id===id);if(!d)return;
  const old=d.status;
  d.company=$('#dealCompany').value.trim()||'(未填公司)';
  d.bd=$('#dealBd').value.trim();
  d.date=$('#dealDate').value||today();
  d.status=$('#dealStatus').value;
  const g=awardDealCoins(old,d.status);
  if(g)addCoins(g, d.status==='Won'?'Won +99':'Accept +50');
  save();closeModal();render();
}
function delDeal(id){
  S.work.deals=S.work.deals.filter(x=>x.id!==id);
  save();render();toast('已删除');
}
function dealTable(rows,type){
  if(!rows.length){
    return `<div class="deal-list"><div class="empty-hint">${type==='won'?'暂无 Won 记录':'暂无 Opp 记录，点右上角 ＋ 添加'}</div></div>`;
  }
  const isWon=type==='won';
  const cols=isWon
    ? `<col><col style="width:90px"><col style="width:56px"><col>`
    : `<col><col style="width:90px"><col style="width:56px"><col><col>`;
  const head=isWon
    ? `<th>公司</th><th>BD</th><th>日期</th><th>操作</th>`
    : `<th>公司</th><th>BD</th><th>日期</th><th>状态</th><th>操作</th>`;
  const body=rows.map(d=> isWon?wonRow(d):dealRow(d)).join('');
  return `<div class="deal-list"><table class="deal-table ${isWon?'won-table':''}">
    <colgroup>${cols}</colgroup>
    <thead><tr>${head}</tr></thead>
    <tbody>${body}</tbody>
  </table></div>`;
}
function dealRow(d){
  const next=d.status==='PTA'?'accept':(d.status==='Accept'?'Won':null);
  const nextBtn=next?`<button class="btn xs ${next==='Won'?'won':''}" onclick="switchDeal('${d.id}')">${next==='Won'?'Won':'accept'}</button>`:'';
  const stCls=d.status==='PTA'?'st-pta':(d.status==='Accept'?'st-acc':'st-won');
  return `<tr>
    <td class="c-name" title="${esc(d.company)}">${esc(d.company)}</td>
    <td class="c-bd" title="${esc(d.bd)}">${d.bd?esc(d.bd):'—'}</td>
    <td class="c-date" title="${d.date}">${d.date.slice(5)}</td>
    <td><span class="status-badge ${stCls}">${d.status}</span></td>
    <td class="c-act">${nextBtn}<button class="btn xs ghost" onclick="editDeal('${d.id}')">✏️</button><button class="btn xs ghost danger" onclick="delDeal('${d.id}')">✕</button></td>
  </tr>`;
}
function wonRow(d){
  return `<tr>
    <td class="c-name" title="${esc(d.company)}">${esc(d.company)}</td>
    <td class="c-bd" title="${esc(d.bd)}">${d.bd?esc(d.bd):'—'}</td>
    <td class="c-date" title="${d.date}">${d.date.slice(5)}</td>
    <td class="c-act"><button class="btn xs ghost" onclick="editDeal('${d.id}')">✏️</button><button class="btn xs ghost danger" onclick="delDeal('${d.id}')">✕</button></td>
  </tr>`;
}

function bindStudy(){
  document.querySelectorAll('#app .tabs button').forEach(b=>{
    b.onclick=()=>{SUB=b.dataset.st;render();};
  });
  // 工商管理课程
  document.querySelectorAll('.econ-row[data-lid]').forEach(el=>{
    el.onclick=()=>markLesson(el.dataset.lid);
  });
  document.querySelectorAll('.econ-row[data-elid]').forEach(el=>{
    el.onclick=()=>markEco(el.dataset.elid);
  });
  // 学习计划
  document.querySelectorAll('#planList .todo-item').forEach(el=>{
    el.onclick=e=>{
      const tgt=e.target;
      if(tgt.dataset.pdel){deletePlan(tgt.dataset.pdel);return;}
      if(tgt.dataset.plink){linkPlanToHome(tgt.dataset.plink);return;}
      if(tgt.dataset.punlink){unlinkPlan(tgt.dataset.punlink);return;}
      const t=S.study.plans.find(x=>x.id===el.dataset.pid);if(!t)return;
      t.done=!t.done;
      syncLinked('tdl',t.id); // 来源项改动，同步到关联今日待办（静默，不重复发币）
      if(t.done)addCoins(10,'完成学习计划');else{S.coins=Math.max(0,S.coins-10);save();renderHeader();}
      save();render();
    };
  });
}
function markLesson(id){
  const l=S.study.biz.find(x=>x.id===id);if(!l)return;
  if(l.date){changeLessonDate(l);}
  else{completeLesson(l);}
}
function markEco(id){
  const l=S.study.economy.find(x=>x.id===id);if(!l)return;
  if(l.date){changeEcoDate(l);}
  else{
    l.date=today();
    const dayCount=S.study.economy.filter(x=>x.date===today()).length;
    let gain=10;if(dayCount>=2)gain+=6*(dayCount-1>1?1:0); // 简化：同日第2课起额外+6
    // 精确：同日已完成课数
    const sameDay=S.study.economy.filter(x=>x.date===today()).length;
    gain=10+(sameDay>=2?6:0);
    addCoins(gain,'完成课程');save();render();
  }
}
function completeLesson(l){
  l.date=today();
  // 计算同日已完成课数（含本次）
  const sameDay=S.study.biz.filter(x=>x.date===today()).length;
  let gain=10;
  if(sameDay>=2)gain+=6; // 当日第N(N≥2)课额外+6
  addCoins(gain,'完成课程');save();render();
}

/* ---------- 学习计划（可一键同步到仪表盘今日待办，双边同步） ---------- */
function addPlan(){
  const i=$('#planInput');const v=i.value.trim();if(!v)return;
  S.study.plans.unshift({id:uid(),text:v,done:false,homeId:null});
  i.value='';save();render();
}
function addPlanToday(){
  const i=$('#planInput');const v=i.value.trim();if(!v)return;
  const todo={id:uid(),text:v,done:false,src:'study',wid:null};
  const p={id:uid(),text:v,done:false,homeId:todo.id};
  todo.wid=p.id;
  S.study.plans.unshift(p);
  S.todos.unshift(todo);
  i.value='';save();render();
}
function linkPlanToHome(pid){
  const t=S.study.plans.find(x=>x.id===pid);if(!t||t.homeId)return;
  const todo={id:uid(),text:t.text,done:t.done,src:'study',wid:t.id};
  t.homeId=todo.id;
  S.todos.unshift(todo);
  save();render();toast('已加入今日待办 ✅');
}
function unlinkPlan(pid){
  const t=S.study.plans.find(x=>x.id===pid);if(!t)return;
  if(t.homeId){S.todos=S.todos.filter(x=>x.id!==t.homeId);t.homeId=null;}
  save();render();toast('已放回清单，下次再说 😌');
}
function deletePlan(pid){
  const t=S.study.plans.find(x=>x.id===pid);
  if(t&&t.homeId)S.todos=S.todos.filter(x=>x.id!==t.homeId);
  S.study.plans=S.study.plans.filter(x=>x.id!==pid);save();render();
}

}

function openCheckinDay(date){
  const rec=S.life.checkins[date]||{};

    const active=c.auto?r.done:!!r.note;

    html+=`<div class="ci-item ${active?'ci-on':''}" data-ci="${c.k}">

        <div class="ci-note"><input id="cinote_${c.k}" placeholder="${c.auto?'爱好联动自动打卡':(c.n+'（填写即打卡）')}" value="${esc(r.note||'')}"></div>

function fillCiNote(k,n){

}
// 发放「完成日常打卡 +10 🪙/天」金币；幂等：同一天只发一次（ciRewarded 去重）
function rewardDailyCheckin(date){
  const rec=S.life.checkins[date];if(!rec)return false;
  const doneCount=Object.values(rec).filter(r=>r&&r.done).length;
  if(doneCount>0 && !S.life.ciRewarded[date]){
    S.life.ciRewarded[date]=true;addCoins(10,'日常打卡');
    return true;
  }
  return false;
}
function saveCheckin(date){
  const rec=S.life.checkins[date]||(S.life.checkins[date]={});
  CHECKINS.forEach(c=>{
    const note=$('#cinote_'+c.k);
    const val=note?note.value.trim():'';
    rec[c.k]=rec[c.k]||{done:false,note:''};
    if(val){
      rec[c.k].note=val;
      if(!c.auto)rec[c.k].done=true;          // 手动项：填写即打卡
      const arr=S.life.ciRecent[c.k]||(S.life.ciRecent[c.k]=[]);
      if(!arr.includes(val)){arr.unshift(val);if(arr.length>5)arr.pop();}
    }else{
      if(!c.auto){rec[c.k].done=false;rec[c.k].note='';} // 手动项：清空即取消打卡（自动项保留联动）
    }
  });
  const rewarded=rewardDailyCheckin(date);
  save();closeModal();render();toast(rewarded?'打卡已保存，日常打卡 +10 🪙':'打卡已保存');
}
function clearCiItem(date,k){
  const rec=S.life.checkins[date];
  if(rec&&rec[k]){rec[k]={done:false,note:''};}
  save();
  // 仅更新这一项显示，不动其他已填输入，避免清空时误丢其他内容
  const item=document.querySelector('.ci-item[data-ci="'+k+'"]');
  if(item){
    const inp=item.querySelector('input');if(inp)inp.value='';
    item.classList.remove('ci-on');
    const ok=item.querySelector('.ci-ok');if(ok)ok.remove();
    const cb=item.querySelector('.ci-clear');if(cb)cb.remove();
  }
}

  });

function drawMeasChart(){
  const cv=$('#measChart');if(!cv)return;const ctx=cv.getContext('2d');if(!ctx)return;
  ctx.clearRect(0,0,cv.width,cv.height);
  const data=S.beauty.meas;
  const metrics=[
    {k:'weight',n:'体重',c:'#FF6B1A'},{k:'chest',n:'胸',c:'#E8553E'},
    {k:'waist',n:'腰',c:'#4A90D9'},{k:'belly',n:'肚',c:'#9B59B6'},
    {k:'hip',n:'臀',c:'#3FB97A'},{k:'arm',n:'手臂',c:'#F1C40F'},{k:'thigh',n:'大腿',c:'#16A085'},
  ];
  if(data.length<1){ctx.fillStyle='#8A7A6E';ctx.font='16px sans-serif';ctx.fillText('暂无数据',20,40);return;}
  const pad=40,W=cv.width-pad*2,H=cv.height-pad*2;
  // 纵轴范围按所有数值
  let all=[];metrics.forEach(m=>data.forEach(d=>{if(d[m.k]!=null)all.push(d[m.k]);}));
  if(!all.length)return;
  const min=Math.min(...all),max=Math.max(...all);
  const range=(max-min)||1;
  // 轴
  ctx.strokeStyle='#FFD9C2';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(pad,pad);ctx.lineTo(pad,pad+H);ctx.lineTo(pad+W,pad+H);ctx.stroke();
  ctx.fillStyle='#8A7A6E';ctx.font='11px sans-serif';
  for(let i=0;i<=4;i++){const y=pad+H-(H*i/4);const val=(min+range*i/4).toFixed(0);
    ctx.fillText(val,4,y+4);ctx.beginPath();ctx.moveTo(pad,y);ctx.lineTo(pad+W,y);ctx.strokeStyle='#FFF0E6';ctx.stroke();}
  // X 标签
  const n=data.length;
  data.forEach((d,i)=>{const x=pad+W*(n===1?0.5:i/(n-1));ctx.fillStyle='#8A7A6E';ctx.fillText(d.date.slice(5),x-14,pad+H+16);});
  // 折线
  metrics.forEach(m=>{
    ctx.strokeStyle=m.c;ctx.lineWidth=2;ctx.beginPath();let started=false;
    data.forEach((d,i)=>{if(d[m.k]==null)return;const x=pad+W*(n===1?0.5:i/(n-1));
      const y=pad+H-((d[m.k]-min)/range)*H;if(!started){ctx.moveTo(x,y);started=true;}else ctx.lineTo(x,y);
      ctx.fillStyle=m.c;ctx.arc(x,y,2.5,0,7);ctx.fill();});
    ctx.stroke();
  });
  // 图例
  ctx.font='10px sans-serif';let lx=pad,ly=12;
  metrics.forEach(m=>{ctx.fillStyle=m.c;ctx.fillRect(lx,ly-8,8,8);ctx.fillStyle='#3A2A20';ctx.fillText(m.n,lx+10,ly);lx+=42;});
}

function viewHobby(){
  const tabs=`<div class="hobby-tabs">`+HOBBY_TYPES.map(t=>

  const def=HOBBY_TYPES.find(t=>t.k===type)||HOBBY_TYPES[0];

  const isOngoing=p=>p.status==='ing'||p.startedAt||(p.sessions&&p.sessions.length>0);
  const stOrder=p=>p.status==='done'?1:(isOngoing(p)?0:2);
  const list=S.hobby.projects.filter(p=>p.type===type).sort((a,b)=>stOrder(a)-stOrder(b));
  const projs=list.map(p=>{
    const ti=p.type==='read'?'📖':def.ic;
    // 标签/样式：有开工记录（历史计时 / 正在计时 / 已标记进行中）即视为“进行中”；按钮严格由 startedAt 决定（真正在计时才显示结束计时）
    const ongoing=p.status==='ing'||p.startedAt||(p.sessions&&p.sessions.length>0);
    const stCls=p.status==='done'?'done':(ongoing?'ing':'Pending');
    const stLabel=p.status==='done'?'已完成':(ongoing?'进行中':'待开始');
    const thumb=p.image?`<img class="thumb" src="${esc(p.image)}" onerror="this.textContent='${ti}'">`:`<div class="thumb">${ti}</div>`;
    const dur=Math.round((p.sessions||[]).reduce((a,s)=>a+s.min,0));
    const actions=[];
    if(p.status==='done'){
      actions.push(`<button class="btn small" style="background:#4A90D9" onclick="reopenProj('${p.id}')" title="重开">🔄 重开</button>`);
    }else{
      if(p.startedAt)actions.push(`<button class="btn small" style="background:#4A90D9" onclick="stopProj('${p.id}')" title="结束计时">⏹</button>`);
      else actions.push(`<button class="btn small" onclick="startProj('${p.id}')" title="开始计时">▶</button>`);
      actions.push(`<button class="btn small ghost" onclick="doneProj('${p.id}')" title="标记完成">✓</button>`);
    }
    actions.push(`<button class="btn small danger" onclick="delProj('${p.id}')" title="删除">✕</button>`);
    actions.push(`<button class="btn small ghost" onclick="editProj('${p.id}')" title="编辑">✎</button>`);
    return `<div class="proj ${stCls}" data-pid="${p.id}">
      <div class="p-tab">${stLabel}</div>
      <div class="p-body">
        <div class="p-top">${thumb}
          <div class="p-info">
            <div class="p-name-row"><span class="p-name">${esc(p.name)}</span></div>
            <div class="p-meta">⏱ ${dur}分 · 📅 ${p.doneDays||0}天</div>
          </div>
        </div>
        <div class="p-actions">${actions.join('')}</div>
      </div>
    </div>`;
  }).join('');
  return `
  <div class="topbar"><h2>🎨 爱好</h2>
    <button class="btn small" onclick="addProj('${type}')">➕ 添加${def.n}项目</button></div>
  ${tabs}
  <div id="projList">${projs||`<div class="empty">还没有${def.n}项目，点右上角添加~</div>`}</div>`;
}
function bindHobby(){
  document.querySelectorAll('#app .hobby-tabs button').forEach(b=>{
    b.onclick=()=>{SUB=b.dataset.ht;render();};
  });
}
function addProj(type){
  const isRead=type==='read';
  showModal(`➕ 添加${HOBBY_TYPES.find(t=>t.k===type).n}项目`,`
    <div class="field"><label>项目名称</label><input id="p_name" placeholder="如：1000片小镇拼图"></div>
    <div class="field"><label>图片 URL（可粘贴，可留空）</label><input id="p_img" placeholder="https://…"></div>
    ${isRead?`<div class="field"><label>实体类型</label><select id="p_entity">
        <option value="电子书">电子书</option><option value="纸质书">纸质书</option></select></div>`:''}
    <div class="row">
      <div class="field" style="margin:0"><label>价格</label><input id="p_price" type="number" placeholder="0"></div>
      <div class="field" style="margin:0"><label>购买渠道</label><select id="p_channel">
        ${CHANNELS.map(c=>`<option ${isRead&&c==='其他'?'selected':''}>${c}</option>`).join('')}</select></div>
    </div>
    ${isRead?`<div class="field"><label>种草原因</label><input id="p_reason" placeholder="为什么想看这本书"></div>`:''}
    <button class="btn" style="width:100%" onclick="saveProj(null,'${type}')">保存</button>
  `);
}
function editProj(id){
  const p=S.hobby.projects.find(x=>x.id===id);if(!p)return;
  _editingSessionIdx=-1;
  const isRead=p.type==='read';
  const liveElapsed=p.startedAt?Math.round(((Date.now()-p.startedAt)/60000)*10)/10:0;
  const lastS=(p.sessions&&p.sessions.length)?p.sessions[p.sessions.length-1]:null;
  const timingBlock = p.startedAt?`
    <div class="sec-title">⏱ 当前计时进行中</div>
    <div class="sub">上次点了开始却去做了别的？可结束并填真实时长，或放弃本次计时。</div>
    <div class="row">
      <div class="field" style="margin:0"><label>结束时长(分)</label><input id="p_custommin" type="number" step="0.1" value="${liveElapsed}"></div>
    </div>
    <div class="row" style="margin-top:8px;gap:8px">
      <button class="btn ghost small" onclick="stopProjCustom('${id}')">结束并保存</button>
      <button class="btn ghost small danger" onclick="discardTiming('${id}')">放弃本次</button>
    </div>
  `:(lastS?`
    <div class="sec-title">修改计时</div>
    <div class="row">
      <div class="field" style="margin:0"><label>日期</label><input id="p_lastdate" type="date" value="${lastS.date}"></div>
      <div class="field" style="margin:0"><label>时长(分)</label><input id="p_lastmin" type="number" step="0.1" value="${lastS.min}"></div>
    </div>
    <button class="btn ghost small mt" onclick="updLastSession('${id}')">保存时长</button>
  `:'');
  const sessList=(p.sessions&&p.sessions.length)?`<div class="sec-title">历史计时（点击“改”载入、✕ 删除）</div>`+
    p.sessions.map((s,idx)=>`<div class="row sess-row">
      <span class="sess-date">${s.date}</span>
      <span class="sess-min">${s.min} 分</span>
      <button class="btn xs ghost" onclick="updSession('${id}','${idx}')">改</button>
      <button class="btn xs ghost danger" onclick="delSess('${id}','${idx}')">✕</button>
    </div>`).join(''):'';
  showModal('✎ 编辑项目',`
    <div class="field"><label>项目名称</label><input id="p_name" value="${esc(p.name)}"></div>
    <div class="field"><label>图片 URL</label><input id="p_img" value="${esc(p.image||'')}"></div>
    ${isRead?`<div class="field"><label>实体类型</label><select id="p_entity">
        <option ${p.entity==='电子书'?'selected':''}>电子书</option><option ${p.entity==='纸质书'?'selected':''}>纸质书</option></select></div>`:''}
    <div class="row">
      <div class="field" style="margin:0"><label>价格</label><input id="p_price" type="number" value="${p.price||''}"></div>
      <div class="field" style="margin:0"><label>购买渠道</label><select id="p_channel">
        ${CHANNELS.map(c=>`<option ${p.channel===c?'selected':''}>${c}</option>`).join('')}</select></div>
    </div>
    ${isRead?`<div class="field"><label>种草原因</label><input id="p_reason" value="${esc(p.reason||'')}"></div>`:''}
    ${timingBlock}
    ${sessList}
    <div class="sec-title">补登计时</div>
    <div class="row">
      <div class="field" style="margin:0"><label>日期</label><input id="p_sdate" type="date" value="${today()}"></div>
      <div class="field" style="margin:0"><label>时长(分)</label><input id="p_smin" type="number" placeholder="60"></div>
    </div>
    <button class="btn ghost small mt" onclick="addSession('${id}')">+ 补登记本次</button>
    <button class="btn" style="width:100%;margin-top:10px" onclick="saveProj('${id}','${p.type}')">保存修改</button>
  `);
}
function saveProj(id,type){
  const name=$('#p_name').value.trim();if(!name){toast('请填项目名称');return;}
  const img=$('#p_img').value.trim();
  const price=$('#p_price').value;
  const channel=$('#p_channel').value;
  const entity=type==='read'?$('#p_entity').value:null;
  const reason=type==='read'?$('#p_reason').value.trim():null;
  if(id){
    const p=S.hobby.projects.find(x=>x.id===id);
    Object.assign(p,{name,image:img,price:price!==''?price:'',channel,entity,reason});
  }else{
    S.hobby.projects.push({id:uid(),type,name,image:img,
      price:price!==''?price:'',channel,entity,reason,
      status:'Pending',sessions:[],startDate:null,endDate:null,doneDays:0});
  }
  syncCheckins();save();closeModal();render();toast('已保存');
}
function addSession(id){
  const p=S.hobby.projects.find(x=>x.id===id);if(!p)return;
  const d=$('#p_sdate').value||today();const min=parseInt($('#p_smin').value)||0;
  if(!min)return;
  p.sessions.push({date:d,min});
  p.doneDays=new Set(p.sessions.map(s=>s.date)).size;
  syncCheckins();save();render();toast('已补登记');
}
function startProj(id){
  const p=S.hobby.projects.find(x=>x.id===id);if(!p)return;
  if(p.status==='done'){toast('已完成项目');return;}
  p.status='ing';if(!p.startDate)p.startDate=today();
  p.startedAt=Date.now(); // 记录真实开始时间戳，停止时按实际差额计时
  // 自动日常打卡联动（以爱好数据为准重建），并触发每日打卡币
  const wasRewarded=!!S.life.ciRewarded[today()];
  syncCheckins();
  save();render();
  toast(wasRewarded?'开始计时，已联动打卡 🎉':'开始计时，已联动打卡 +10 🪙 🎉');
}
function stopProj(id){
  const p=S.hobby.projects.find(x=>x.id===id);if(!p)return;
  let mins=0;
  if(p.startedAt){
    // 按开始→结束的真实时间差额记录（分钟，保留 1 位小数）
    mins=Math.round(((Date.now()-p.startedAt)/60000)*10)/10;
    if(mins<0)mins=0;
  }
  if(mins>0)p.sessions.push({date:today(),min:mins});
  p.doneDays=new Set(p.sessions.map(s=>s.date)).size;
  p.startedAt=null;
  if(p.status==='ing')p.status='Pending';
  syncCheckins();save();render();
  toast(mins>0?`计时结束 +${mins} 分钟`:'计时结束（时长过短，未记录）');
}
function stopProjCustom(id){
  const p=S.hobby.projects.find(x=>x.id===id);if(!p)return;
  let mins=parseFloat(($('#p_custommin')||{}).value);
  if(isNaN(mins)||mins<0)mins=0;
  mins=Math.round(mins*10)/10;
  if(mins>0)p.sessions.push({date:today(),min:mins});
  p.doneDays=new Set(p.sessions.map(s=>s.date)).size;
  p.startedAt=null;
  if(p.status==='ing')p.status='Pending';
  syncCheckins();save();render();editProj(id);
  toast(mins>0?`已按自定义时长保存 +${mins} 分钟`:'已结束（时长 0，未记录）');
}
function discardTiming(id){
  const p=S.hobby.projects.find(x=>x.id===id);if(!p)return;
  p.startedAt=null;
  if(p.status==='ing')p.status='Pending';
  syncCheckins();save();render();editProj(id);
  toast('已放弃本次计时（未记录时长）');
}
function updSession(id,idx){
  const p=S.hobby.projects.find(x=>x.id===id);if(!p)return;
  const s=p.sessions[idx];if(!s)return;
  _editingSessionIdx=idx;
  const dEl=$('#p_lastdate'),mEl=$('#p_lastmin');
  if(dEl)dEl.value=s.date;if(mEl)mEl.value=s.min;
  toast('已载入该次计时，可改后点“保存时长”');
}
function delSess(id,idx){
  const p=S.hobby.projects.find(x=>x.id===id);if(!p||!p.sessions||idx<0||idx>=p.sessions.length)return;
  p.sessions.splice(idx,1);
  _editingSessionIdx=-1;
  p.doneDays=new Set(p.sessions.map(s=>s.date)).size;
  syncCheckins();save();render();editProj(id);
  toast('已删除该次计时');
}
function updLastSession(id){
  const p=S.hobby.projects.find(x=>x.id===id);if(!p||!p.sessions||!p.sessions.length){toast('还没有计时记录');return;}
  const idx=_editingSessionIdx>=0?_editingSessionIdx:p.sessions.length-1;
  let min=parseFloat(($('#p_lastmin')||{}).value);
  if(isNaN(min)||min<0){toast('请输入有效时长');return;}
  const d=($('#p_lastdate')||{}).value||p.sessions[idx].date;
  p.sessions[idx].min=Math.round(min*10)/10;
  p.sessions[idx].date=d;
  p.doneDays=new Set(p.sessions.map(s=>s.date)).size;
  _editingSessionIdx=-1;
  syncCheckins();save();render();editProj(id);
  toast('已修改该次计时');
}
function doneProj(id){
  const p=S.hobby.projects.find(x=>x.id===id);if(!p)return;
  p.status='done';p.endDate=today();
  save();render();toast('🎉 完成！');
}
function reopenProj(id){
  const p=S.hobby.projects.find(x=>x.id===id);if(!p)return;
  p.status='ing';                  // 回到“进行中”
  p.endDate=null;
  if(!p.startDate)p.startDate=today();
  p.startedAt=Date.now();          // 重新开始计时（与“开始计时”语义一致）
  syncCheckins();save();render();  // 重开即恢复当天自动打卡联动
  toast('🔄 已重开，回到进行中并重新开始计时');
}
function delProj(id){
  S.hobby.projects=S.hobby.projects.filter(x=>x.id!==id);
  syncCheckins();save();render();
}
// 爱好类型 → 日常打卡自动项 key
const HOBBY_TO_CHECKIN={puzzle:'puzzle',draw:'draw',model:'model',read:'reading'};
let _editingSessionIdx=-1;
// 以爱好数据为准，重建所有“爱好联动”自动打卡项：
//  · 项目在某天有计时（已完成 session 或正在计时）= 该天对应类型打卡 done，备注=项目名
//  · 项目/某天计时被删除 → 该天对应打卡项移除（当天无其他同类型项目贡献时）
//  · 多项目同天同类型 → 备注用“、”连接各项目名
function syncCheckins(){
  const contrib={};
  (S.hobby.projects||[]).forEach(p=>{
    const k=HOBBY_TO_CHECKIN[p.type];if(!k)return;
    const byDate=contrib[k]||(contrib[k]={});
    (p.sessions||[]).forEach(s=>{
      if(s&&s.date)(byDate[s.date]||(byDate[s.date]=new Set())).add(p.name);
    });
    if(p.startedAt){
      const td=today();
      (byDate[td]||(byDate[td]=new Set())).add(p.name);
    }
  });
  CHECKINS.filter(c=>c.auto).forEach(c=>{
    const k=c.k,byDate=contrib[k]||{};
    Object.keys(S.life.checkins).forEach(d=>{
      const rec=S.life.checkins[d];
      if(rec&&rec[k]){
        const names=byDate[d];
        if(!names||names.size===0){
          delete rec[k];
          if(Object.keys(rec).length===0)delete S.life.checkins[d];
        }else rec[k]={done:true,note:[...names].join('、'),auto:true};
      }
    });
    Object.keys(byDate).forEach(d=>{
      const names=byDate[d];if(!names||names.size===0)return;
      S.life.checkins[d]=S.life.checkins[d]||{};
      S.life.checkins[d][k]={done:true,note:[...names].join('、'),auto:true};
    });
  });
  // 联动打卡同样应触发「完成打卡 +10 🪙/天」；幂等，靠 ciRewarded 去重（不重复发、也不回收）
  Object.keys(S.life.checkins).forEach(d=>rewardDailyCheckin(d));
}

/* ---------- 设置 ---------- */
function viewSettings(){
  const size=(JSON.stringify(S).length/1024).toFixed(1);
  return `
  <div class="topbar"><h2>⚙️ 设置</h2></div>
  <div class="card">
    <h3><span class="emo">💾</span>数据管理</h3>
    <p class="sub">存储键：<code>linxi_dashboard_v2</code> · 当前占用 ${size} KB</p>
    <div class="row mt">
      <button class="btn" onclick="exportData()">📥 导出 JSON</button>
      <button class="btn ghost" onclick="importData()">📤 导入 JSON</button>
    </div>
    <button class="btn danger mt" style="width:100%" onclick="clearData()">🗑️ 清除所有数据（需二次确认）</button>
  </div>
  <div class="card">
    <h3><span class="emo">📌</span>关于</h3>
    <p class="sub">林夕个人管理工作台 v1.4 · 奶茶陪你度过每一天 🥕<br>
    纯静态 HTML+CSS+JS。数据保存在本机浏览器（localStorage），跨设备同步请用上方「📥 导出 JSON / 📤 导入 JSON」：在 A 设备导出文件、在 B 设备导入即可合并历史数据。Canvas 自绘图表，响应式适配手机/平板/电脑。</p>
  </div>`;
}
function exportData(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='linxi_dashboard_'+today()+'.json';a.click();
  toast('已导出');
}
function importData(){
  if(!confirm('导入会覆盖当前数据，先导出数据备份喔！\n\n确定要继续导入吗？')) return;
  const inp=document.createElement('input');inp.type='file';inp.accept='application/json';
  inp.onchange=()=>{const f=inp.files[0];if(!f)return;const rd=new FileReader();
    rd.onload=()=>{try{const d=JSON.parse(rd.result);
      // 以导入文件为准（覆盖当前），并补齐可能缺失的字段，再写回
      S=Object.assign({},d);migrate();syncCheckins();save();render();
      toast('✅ 导入成功，数据已同步');
    }catch(e){toast('JSON 解析失败');}};rd.readAsText(f);};
  inp.click();
}
function clearData(){
  if(confirm('确定清除所有数据？建议先导出备份！此操作不可恢复。')){
    localStorage.removeItem(KEY);S=defaultState();save();render();toast('已清除');
  }
}

/* ---------- 模态框 ---------- */
function showModal(title,body){
  closeModal();
  const mask=document.createElement('div');mask.className='modal-mask';mask.id='modalMask';
  mask.innerHTML=`<div class="modal"><h3>${title}</h3>${body}</div>`;
  mask.onclick=e=>{if(e.target===mask)closeModal();};
  document.body.appendChild(mask);
}
function closeModal(){const m=$('#modalMask');if(m)m.remove();}

/* ============ 启动 ============ */
(async function(){
  await load();          // 先从本地文件（或浏览器存储）读取历史数据
  bindNav();rollQuote();renderHeader();render();
})();
</script>
